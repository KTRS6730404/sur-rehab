k:hover{background:#eef5fc;cursor:pointer}.hide{display:none}.pill{border-radius:20px;background:#e7eef5;color:#224a6c;padding:4px 9px;font-size:12px}details{border:1px solid #d7e3ed;border-radius:10px;padding:12px;margin:8px 0}summary{cursor:pointer;font-weight:700}.right{margin-left:auto}.report-mini{display:flex;align-items:center;gap:14px;width:100%;margin:7px 0;padding:10px 12px;background:#f5f8fc;border:1px solid #d8e2ee;color:#173b5a;text-align:left;font-size:13px}.report-mini b{min-width:90px}.report-mini span:last-child{margin-left:auto;color:#1765aa}@media(max-width:650px){.report-mini{flex-wrap:wrap;gap:5px 11px}.report-mini b{min-width:0}}nav{position:fixed;top:var(--sur-header-height,160px);left:0;width:244px;height:calc(100vh - var(--sur-header-height,160px));overflow-y:auto;background:#edf2f8;padding:14px 10px;display:flex;flex-direction:column;gap:9px;margin:0;border-right:1px solid #d4deeb;z-index:5}nav button{width:100%;text-align:left;background:#dce7f2;color:#345676;font-weight:600;border-radius:9px}.sur-subnav{display:flex;flex-direction:column;gap:6px;padding:1px 0 5px 12px;border-left:2px solid #bccddd;margin-left:9px}nav .sur-subitem{font-size:13px;padding:9px 11px;background:#e7eef6;color:#42627c}nav .sur-subitem.nav-active{background:#123e70;color:white}nav button.nav-active{background:#123e70;color:white;box-shadow:0 2px 6px #16304725}main:has(nav){padding-left:265px;max-width:1500px;margin-top:0;padding-top:24px} .statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}.statbox{border-radius:12px;padding:16px 14px;color:white}.statbox b{display:block;font-size:30px;margin-top:5px}@media(max-width:650px){.top{position:relative;width:100%;padding:14px 12px;border-right:0}.sur-header{flex-direction:row;align-items:center;gap:12px}.sur-expanded{font-size:14px}.subtitle{font-size:11px}nav{position:static;width:auto;height:auto;display:flex;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px soli (function(){const header=document.querySelector('.top');if(!header)return;const sync=()=>document.documentElement.style.setProperty('--sur-header-height',header.getBoundingClientRect().height+'px');sync();window.addEventListener('resize',sync);if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(header)})();
window.surWatchdog = setTimeout(() => {
 const node=document.getElementById('app');
 if(node && node.textContent.includes('接続しています')) node.innerHTML = '<div class="card"><h1>SURを起動できませんでした</h1><p>認証用プログラムが読み込めないか、接続が完了していません。</p><p>ページを再読み込みしてください。解決しない場合はネットワークやブラウザを変更してください。</p><button onclick="location.reload()">再読み込み</button></div>';
}, 12000);
window.addEventListener('unhandledrejection', e => {
 const node=document.getElementById('app');
 if(node && node.textContent.includes('接続しています')) node.innerHTML='<div class="card"><h1>SURの起動エラー</h1><p>'+String(e.reason?.message||e.reason||'通信に失敗しました').replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再読み込み</button></div>';
});
</script><script type="module">
const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm').catch(e => { document.getElementById('app').innerHTML='<div class="card"><h1>認証ライブラリの読み込み失敗</h1><p>CDNへの接続を確認してください。</p><p>'+String(e?.message||e).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再試行</button></div>'; throw e; });
const sb=createClient('https://bytgtfpmxouylyluvaxr.supabase.co','sb_publishable_2vN1_NxbHsa5LTGEUAg5aQ_-akjnqJB',{auth:{persistSession:true,autoRefreshToken:true}});
const el=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const today=()=>new Date().toLocaleDateString('sv-SE');const stages=['受傷直後・急性期','ジムリハビリⅠ','ジムリハビリⅡ','フィールドⅠ','フィールドⅡ','フィールドⅢ','復帰走前チェック','復帰済み'];let user=null,profile=null,cases=[],view='home',active=null,weeklyDraft=null,pendingCount=0;
function draw(html){el.innerHTML=html}function msg(v){alert(v)}function err(e){msg(e?.message||String(e))}const select=(id,vals)=>`<select id="${id}">${vals.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;const field=(name,id,type='text',value='')=>`<label>${name}</label><input id="${id}" type="${type}" value="${esc(value)}">`;
const get=id=>document.getElementById(id)?.value?.trim()||'';
async function refresh(){let {data:{user:u},error:e}=await sb.auth.getUser();if(e||!u){user=null;profile=null;return auth()}user=u;let r=await sb.from('sur_profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)return draw(`<div class="alert">プロフィール読込エラー: ${esc(r.error.message)}</div>`);profile=r.data;if(!profile)return profileForm();if(profile.role==='rejected')return draw('<div class="card"><h1>申請は承認されませんでした</h1><button onclick="window.surSignout()">ログアウト</button></div>');if(profile.role==='pending')return draw(`<div class="card"><h1>アカウント確認待ち</h1><p>登録は完了しました。管理者による選手・スタッフ権限の確認後に利用できます。</p><button onclick="window.surSignout()">ログアウト</button><button class="secondary" onclick="window.surReload()">再確認</button></div>`);if(!['player','staff','admin','commenter','viewer'].includes(profile.role))return draw('<div class="alert">権限設定を確認してください。</div>');await loadCases();if(profile.role==='admin')await loadPendingCount();home()}
function auth(){draw(`<div class="card" style="max-width:520px;margin:30px auto"><h1>ログイン / 新規登録</h1><div class="line"><button id="signInTab" onclick="window.surTab('in')">ログイン</button><button class="secondary" onclick="window.surTab('up')">新規登録</button></div><div id="register" class="hide"><label>登録区分</label>${select('role',['選手','スタッフ'])}${field('氏名','full_name')}<label>学年</label>${select('grade',['1年','2年','3年','該当なし'])}</div>${field('メールアドレス','email','email')}${field('パスワード（英数字混在8文字以上）','password','password')}<button id="authAction" style="margin-top:14px" onclick="window.surAuth()">ログイン</button><p class="muted">実アカウントで接続します。氏名や傷害報告は許可された利用者にのみ表示されます。</p></div>`)}let signupMode=false;window.surTab=t=>{signupMode=t==='up';document.getElementById('register').classList.toggle('hide',!signupMode);document.getElementById('authAction').textContent=signupMode?'新規登録':'ログイン'};
window.surAuth=async()=>{const email=get('email'),password=get('password');if(!email||!password)return msg('メールとパスワードを入力してください');if(signupMode){if(password.length<8||!/[a-z]/i.test(password)||!/[0-9]/.test(password))return msg('英数字混在で8文字以上のパスワードが必要です');const name=get('full_name');if(!name)return msg('氏名を入力してください');let x=await sb.auth.signUp({email,password});if(x.error)return err(x.error);if(x.data.user&&x.data.session){let p=await sb.from('sur_profiles').insert({id:x.data.user.id,full_name:name,grade:get('grade'),requested_role:get('role')==='スタッフ'?'staff':'player',role:'pending'});if(p.error)return err(p.error)}msg('登録を受け付けました。メール確認が必要な場合は確認を完了し、ログイン後にプロフィールを登録してください。');refresh()}else{let x=await sb.auth.signInWithPassword({email,password});if(x.error)return err(x.error);refresh()}};
function profileForm(){draw(`<div class="card"><h1>プロフィールの登録</h1><p class="muted">メール確認後にもう一度登録内容を保存してください。</p><label>区分</label>${select('p_role',['選手','スタッフ'])}${field('氏名','p_name')}<label>学年</label>${select('p_grade',['1年','2年','3年','該当なし'])}<button style="margin-top:12px" onclick="window.surProfile()">登録</button><button class="secondary" onclick="window.surSignout()">ログアウト</button></div>`)}window.surProfile=async()=>{let r=await sb.from('sur_profiles').insert({id:user.id,full_name:get('p_name'),grade:get('p_grade'),requested_role:get('p_role')==='スタッフ'?'staff':'player',role:'pending'});if(r.error)return err(r.error);refresh()};window.surSignout=async()=>{await sb.auth.signOut();refresh()};window.surReload=refresh;
async function loadCases(){let r=await sb.from('sur_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false});if(r.error){err(r.error);cases=[]}else cases=r.data||[]}

async function loadPendingCount(){const r=await sb.from('sur_profiles').select('id').eq('role','pending');pendingCount=r.error?0:(r.data||[]).length}

let settingsTab='account';
window.surSettings=(tab)=>{if(profile.role!=='admin')return;settingsExpanded=true;view='settings';settingsTab=tab||settingsTab;window.surDrawSettings()};
window.surDrawSettings=async()=>{
 const menu=[['account','アカウント'],['applications','申請'],['permissions','権限'],['exercises','リハビリメニュー']];
 const tabs='';
 let content='';
 if(settingsTab==='account'){
   content='<div class="card"><h2>個人情報の編集</h2><label>氏名</label><input id="account_name" value="'+esc(profile.full_name)+'"><label>学年</label><select id="account_grade">'+['1年','2年','3年','該当なし'].map(x=>'<option '+(profile.grade===x?'selected':'')+'>'+x+'</option>').join('')+'</select><p class="muted">ログインメールアドレスや権限はここでは変更できません。</p><button onclick="window.surSaveAccount()">保存</button></div>';
 }else if(settingsTab==='applications'){
   const r=await sb.from('sur_profiles').select('id,full_name,grade,requested_role,role,created_at').eq('role','pending').order('created_at',{ascending:false});
   if(r.error)return err(r.error);
   pendingCount=(r.data||[]).length;
   content='<div class="card"><h2>申請中 '+(pendingCount?'<span style="background:#c62828;color:white;border-radius:20px;padding:4px 10px">'+pendingCount+'件</span>':'')+'</h2>'+(r.data||[]).map(p=>'<div class="card"><b>'+esc(p.full_name)+'</b>（'+(p.requested_role==='staff'?'スタッフ':'選手')+'）'+(p.requested_role==='staff'?'<label>承認後の権限</label><select id="role_'+p.id+'"><option value="admin">管理者</option><option value="commenter">コメント可</option><option value="viewer">閲覧のみ</option></select>':'')+'<div class="line"><button onclick="window.surReviewAccount(&quot;'+p.id+'&quot;,true)">承認</button><button class="danger" onclick="window.surReviewAccount(&quot;'+p.id+'&quot;,false)">拒否</button></div></div>').join('')+(pendingCount?'':'<p>現在申請はありません。</p>')+'</div>';
 }else if(settingsTab==='permissions'){
   const r=await sb.from('sur_profiles').select('id,full_name,role,requested_role,grade').eq('requested_role','staff').order('full_name',{ascending:true});
   if(r.error)return err(r.error);
   const members=(r.data||[]).filter(p=>['admin','staff','commenter','viewer'].includes(p.role));
   const roleLabel={admin:'管理者',staff:'スタッフ（旧権限）',commenter:'コメント可',viewer:'閲覧のみ'};
   content='<div class="card"><h2>スタッフの権限設定</h2><p class="muted">承認済みスタッフのアクセス権限を変更できます。申請中のスタッフは「申請」で承認してください。</p>'+(members.length?members.map(p=>'<div class="card"><b>'+esc(p.full_name)+'</b><p class="muted">現在：'+esc(roleLabel[p.role]||p.role)+(p.id===user.id?'（自分）':'')+'</p><label>付与する権限</label><select id="permission_'+p.id+'" '+(p.id===user.id?'disabled':'')+'>'+[['admin','管理者'],['commenter','コメント可'],['viewer','閲覧のみ']].map(([value,label])=>'<option value="'+value+'" '+(p.role===value?'selected':'')+'>'+label+'</option>').join('')+'</select><button style="margin-top:10px" '+(p.id===user.id?'disabled':'')+' onclick="window.surSavePermission(&quot;'+p.id+'&quot;)">権限を保存</button></div>').join(''):'<p>承認済みスタッフはまだいません。</p>')+'</div>';
 }else{
   const r=await sb.from('sur_exercise_library').select('*').order('stage',{ascending:true});
   if(r.error)return err(r.error);
   content='<div class="card"><h2>リハビリメニュー管理</h2><p class="muted">メニューの登録・編集・削除は管理者のみ可能です。</p><button onclick="window.surExerciseForm()">＋ 新規登録</button></div>'+(r.data||[]).map(x=>'<div class="card"><b>'+esc(x.name)+'</b><p class="muted">Stage '+x.stage+'：'+esc(stages[x.stage]||'')+' / '+esc(x.injury_category)+'</p><p>'+esc(x.description)+'</p><div class="line"><button class="secondary" onclick="window.surExerciseForm(&quot;'+x.id+'&quot;)">編集</button><button class="danger" onclick="window.surDeleteExercise(&quot;'+x.id+'&quot;)">削除</button></div></div>').join('')||'<p>登録されたメニューはありません。</p>';
   window.surExercises=r.data||[];
 }
 draw(nav()+'<div class="card"><h1>設定</h1>'+tabs+'</div>'+content);
};
window.surSavePermission=async id=>{
 if(profile.role!=='admin')return;
 const role=document.getElementById('permission_'+id)?.value;
 if(!['admin','commenter','viewer'].includes(role))return msg('権限を選択してください');
 if(!confirm('このスタッフの権限を変更しますか？'))return;
 const r=await sb.rpc('sur_set_staff_role',{target_id:id,next_role:role});
 if(r.error)return err(r.error);
 msg('権限を更新しました');
 window.surSettings('permissions');
};
window.surSaveAccount=async()=>{const full_name=get('account_name');if(!full_name)return msg('氏名を入力してください');const r=await sb.from('sur_profiles').update({full_name,grade:get('account_grade')}).eq('id',user.id);if(r.error)return err(r.error);profile.full_name=full_name;profile.grade=get('account_grade');window.surSettings('account')};
window.surExerciseForm=id=>{let x=(window.surExercises||[]).find(y=>y.id===id)||{};window.surEditingExercise=id||null;draw(nav()+'<div class="card"><h2>リハビリメニュー '+(id?'編集':'新規登録')+'</h2><label>種目名</label><input id="ex_name" value="'+esc(x.name||'')+'"><label>対象傷害</label><input id="ex_injury" value="'+esc(x.injury_category||'共通')+'"><label>Stage（リハビリ段階）</label><select id="ex_stage">'+stages.slice(0,7).map((label,i)=>'<option value="'+i+'" '+(Number(x.stage??1)===i?'selected':'')+'>'+i+'：'+esc(label)+'</option>').join('')+'</select><label>実施内容</label><textarea id="ex_description">'+esc(x.description||'')+'</textarea><label>回数・セット等</label><input id="ex_dosage" value="'+esc(x.dosage||'')+'"><label>アドバイス</label><textarea id="ex_advice">'+esc(x.advice||'')+'</textarea><div class="line"><button onclick="window.surSaveExercise()">保存</button><button class="secondary" onclick="window.surSettings(&quot;exercises&quot;)">キャンセル</button></div></div>')};
window.surSaveExercise=async()=>{let obj={name:get('ex_name'),injury_category:get('ex_injury')||'共通',stage:Number(get('ex_stage')),description:get('ex_description'),dosage:get('ex_dosage'),advice:get('ex_advice')};if(!obj.name||!Number.isInteger(obj.stage)||obj.stage<0||obj.stage>6)return msg('種目名とStage（0〜6）を入力してください');let q=window.surEditingExercise?sb.from('sur_exercise_library').update(obj).eq('id',window.surEditingExercise):sb.from('sur_exercise_library').insert(obj);const r=await q;if(r.error)return err(r.error);window.surSettings('exercises')};
window.surDeleteExercise=async id=>{if(!confirm('このメニューを削除しますか？'))return;const r=await sb.from('sur_exercise_library').delete().eq('id',id);if(r.error)return err(r.error);window.surSettings('exercises')};
window.surReviewAccount=async(id,approve)=>{
 if(profile.role!=='admin')return;
 const role=approve?(document.getElementById('role_'+id)?.value||'player'):'rejected';
 if(!confirm(approve?'申請を承認しますか？':'申請を拒否しますか？'))return;
 const r=await sb.rpc('sur_manage_account',{target_id:id,next_role:role});
 if(r.error)return err(r.error);
 await loadPendingCount();window.surSettings('applications');
};
let settingsExpanded=false;
window.surToggleSettings=()=>{if(profile.role!=='admin')return;settingsExpanded=!settingsExpanded;if(settingsExpanded){window.surSettings(settingsTab)}else if(view==='settings'){home()}else{document.querySelector('nav')?.replaceWith((new DOMParser()).parseFromString(nav(),'text/html').querySelector('nav'))}};
function nav(){const item=(title,action,selected,badge='')=>'<button class="'+(selected?'nav-active':'')+'" onclick="'+action+'">'+title+badge+'</button>';let menu='<nav class="no-print">'+item('HOME','window.surHome()',view==='home')+item('傷害報告','window.surReports()',view==='reports')+(profile.role!=='player'?item('週次レポート','window.surWeekly()',view==='weekly'):'');if(profile.role==='admin'){menu+=item('設定 '+(settingsExpanded?'▾':'▸'),'window.surToggleSettings()',view==='settings',pendingCount?'<strong style="background:#bf2525;color:white;border-radius:20px;padding:2px 7px;margin-left:7px">'+pendingCount+'</strong>':'');if(settingsExpanded)menu+='<div class="sur-subnav">'+[['account','アカウント'],['applications','申請'],['exercises','リハビリメニュー']].map(([key,label])=>'<button class="sur-subitem '+(view==='settings'&&settingsTab===key?'nav-active':'')+'" onclick="window.surSettings(&quot;'+key+'&quot;)">'+label+'</button>').join('')+'</div>';}return menu+item('ログアウト','window.surSignout()',false)+'</nav>'}
