window.surHeaderRefresh=async()=>{
 const el=document.getElementById('sur-header-right');if(!el||!profile||!user)return;
 el.style.display='flex';
 if(profile.avatar_path!==surHeaderLastAvatar){surHeaderLastAvatar=profile.avatar_path||'';surAvatarSigned='';if(profile.avatar_path){const t=await sb.storage.from('sur-avatars').createSignedUrl(profile.avatar_path,3600);surAvatarSigned=t.data?.signedUrl||''}}
 const badge=surNotificationItems.filter(x=>!surReadNotifications.has(x.key)).length;
 el.innerHTML='<button class="sur-header-tool" aria-label="通知" title="通知" onclick="window.surToggleNotifications()"><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>'+(badge?'<span class="sur-count-badge">'+badge+'</span>':'')+'</button><button class="sur-header-tool" aria-label="ヘルプ" title="ヘルプ" onclick="window.surShowHelp()">?</button><div class="sur-user-box" onclick="window.surOpenAccount()" title="個人情報の編集">'+(surAvatarSigned?'<img class="sur-avatar" src="'+esc(surAvatarSigned)+'" alt="顔写真">':'<div class="sur-avatar-fallback">♙</div>')+'<div><b>'+esc(profile.full_name||'ユーザー')+'</b><small>'+esc(surRoleName(profile))+'</small></div></div>';
};
window.surOpenAccount=()=>{if(['admin','staff','commenter'].includes(profile.role)){window.surSettings('account');return}window.surPlayerProfile()};
window.surPlayerProfile=()=>{if(!profile)return;const content='<div class="card"><h2>個人情報の編集</h2><p class="muted">顔写真・氏名・学年を設定できます。</p><div class="sur-profile-avatar-line"><div class="sur-avatar-fallback" style="width:72px;height:72px">♙</div><div><label>顔写真（JPG / PNG / WebP、5MB以内）</label><input id="sur-avatar-file" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="window.surSaveAvatar()">写真を設定</button></div></div><div class="sur-profile-fields"><div class="sur-profile-name"><label>氏名</label><input id="sur-player-name" value="'+esc(profile.full_name)+'"></div><div class="sur-profile-grade"><label>学年</label><select id="sur-player-grade">'+['1年','2年','3年','該当なし'].map(v=>'<option '+(profile.grade===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><div class="line" style="margin-top:14px"><button onclick="window.surPlayerSaveIdentity()">個人情報を保存</button><button class="secondary" onclick="window.surHome()">戻る</button></div></div>';view='my-account';draw(nav()+content)};
window.surPlayerSaveIdentity=async()=>{const n=get('sur-player-name'),g=get('sur-player-grade');const r=await sb.rpc('sur_update_own_identity',{p_name:n,p_grade:g});if(r.error)return err(r.error);profile.full_name=n;profile.grade=g;window.surHeaderRefresh();msg('個人情報を更新しました');window.surPlayerProfile()};

window.surCloseHeaderPanel=()=>{document.getElementById('sur-header-popover').innerHTML=''};
window.surShowHelp=(topic='')=>{const box=document.getElementById('sur-header-popover');if(box.innerHTML){box.innerHTML='';return}box.innerHTML='<div class="sur-popover"><div class="line" style="justify-content:space-between"><h2>ヘルプ・使い方</h2><button class="secondary" onclick="window.surCloseHeaderPanel()">閉じる</button></div><details open><summary>傷害報告の登録方法</summary><p>左メニューの「傷害報告」から新規登録します。受傷日・部位・症状を入力し、必要に応じて写真を添付します。</p></details><details><summary>今日のリハビリの進め方</summary><p>HOMEで痛み・腫れ・前回との変化を登録し、スタッフが登録したメニューを確認します。Stageの変更はスタッフが判断します。</p></details><details><summary>「通常メニューを保留」とは？</summary><p>強い症状、医師の運動制限、骨折などの場合、安全のため通常メニューを保留します。表示を消すために痛みを低く入力せずスタッフに相談してください。</p></details><details><summary>スタッフへの相談</summary><p>選手HOMEの「困ったとき」から相談できます。急な強い症状の場合はアプリだけでなく直接スタッフや医療機関に連絡してください。</p></details><details><summary>顔写真・プロフィール</summary><p>右上の顔写真・氏名を押すとプロフィールを開けます。顔写真はJPG・PNG・WebP、5MB以内です。</p></details></div>'};
window.surToggleNotifications=async()=>{const box=document.getElementById('sur-header-popover');if(box.innerHTML){box.innerHTML='';return}box.innerHTML='<div class="sur-popover">通知を読み込み中…</div>';await window.surLoadNotifications(true)};
window.surMarkRead=async key=>{const r=await sb.from('sur_notification_reads').upsert({user_id:user.id,notification_key:key},{onConflict:'user_id,notification_key'});if(r.error)return err(r.error);surReadNotifications.add(key);window.surHeaderRefresh();window.surShowNotifications()};
window.surShowNotifications=()=>{const box=document.getElementById('sur-header-popover');if(!box)return;box.innerHTML='<div class="sur-popover"><div class="line" style="justify-content:space-between"><h2>新着通知</h2><button class="secondary" onclick="window.surCloseHeaderPanel()">閉じる</button></div>'+(surNotificationItems.filter(x=>!surReadNotifications.has(x.key)).map(x=>'<div class="staff-permission-item"><b>'+esc(x.title)+'</b><p>'+esc(x.text)+'</p><button onclick="window.surMarkRead(&quot;'+esc(x.key)+'&quot;)">確認済みにする</button></div>').join('')||'<p class="muted">新着通知はありません。</p>')+'</div>'};
window.surLoadNotifications=async(show=false)=>{
 if(!user||!profile)return;
 const items=[];
 if(profile.role!=='player'){
  const [requests,help,cs]=await Promise.all([sb.from('sur_profiles').select('id,full_name,created_at').eq('role','pending').limit(100),sb.from('sur_player_help').select('id,kind,message,created_at').eq('status','open').limit(100),sb.from('sur_cases').select('id,player_name,injury_category,created_at,current_stage,reviewed_at,return_reviewed_at').is('deleted_at',null).limit(200)]);
  (requests.data||[]).forEach(x=>items.push({key:'request-'+x.id,title:'新しい登録申請',text:x.full_name||'氏名未設定'}));
  (help.data||[]).forEach(x=>items.push({key:'help-'+x.id,title:'選手からの相談',text:x.kind+'：'+(x.message||'内容を確認してください')}));
  (cs.data||[]).forEach(x=>{if(x.current_stage===7&&!x.return_reviewed_at)items.push({key:'return-'+x.id,title:'復帰確認待ち',text:x.player_name||'選手'});else if(x.current_stage!==7&&!x.reviewed_at)items.push({key:'report-'+x.id,title:'新規傷害報告',text:x.player_name||'選手'})});
 }
 if(profile.role==='player'){const mine=cases.filter(c=>c.player_id===user.id);if(mine.length){const ids=mine.map(c=>c.id);const hist=await sb.from('sur_stage_history').select('id,case_id,to_stage,created_at').in('case_id',ids).order('created_at',{ascending:false}).limit(50);(hist.data||[]).forEach(x=>{const c=mine.find(c=>c.id===x.case_id);items.push({key:'stage-'+x.id,title:'リハビリStage更新',text:(c?.injury_category||'傷害')+'：'+(stages[x.to_stage]||'Stage '+x.to_stage)})})}}
 surNotificationItems=items;
 const keys=items.map(x=>x.key);
 if(keys.length){const r=await sb.from('sur_notification_reads').select('notification_key').eq('user_id',user.id).in('notification_key',keys);if(!r.error)surReadNotifications=new Set((r.data||[]).map(x=>x.notification_key))}else surReadNotifications=new Set();
 await window.surHeaderRefresh();if(show)window.surShowNotifications();
};
window.surSaveAvatar=async()=>{
 const file=document.getElementById('sur-avatar-file')?.files?.[0];
 if(!file)return msg('画像を選択してください');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)return msg('JPG・PNG・WebP、5MB以内の画像を選んでください');
 const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path=user.id+'/'+crypto.randomUUID()+'.'+ext;
 const u=await sb.storage.from('sur-avatars').upload(path,file,{contentType:file.type,upsert:false});if(u.error)return err(u.error);
 const saved=await sb.rpc('sur_set_avatar',{p_path:path});if(saved.error)return err(saved.error);
 profile.avatar_path=path;surHeaderLastAvatar='';await window.surHeaderRefresh();msg('顔写真を保存しました');
 if(['admin','staff','commenter'].includes(profile.role))window.surSettings('account');else window.surPlayerProfile();
};

async function refresh(){let {data:{user:u},error:e}=await sb.auth.getUser();if(e||!u){user=null;profile=null;return auth()}user=u;let r=await sb.from('sur_profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)return draw(`<div class="alert">プロフィール読込エラー: ${esc(r.error.message)}</div>`);profile=r.data;if(!profile)return profileForm();if(profile.is_archived)return draw('<div class="card"><h1>アカウントは利用停止中です</h1><p>管理者にお問い合わせください。</p><button onclick="window.surSignout()">ログアウト</button></div>');if(profile.role==='rejected')return draw('<div class="card"><h1>申請は承認されませんでした</h1><button onclick="window.surSignout()">ログアウト</button></div>');if(profile.role==='pending')return draw(`<div class="card"><h1>アカウント確認待ち</h1><p>登録は完了しました。管理者による選手・スタッフ権限の確認後に利用できます。</p><button onclick="window.surSignout()">ログアウト</button><button class="secondary" onclick="window.surReload()">再確認</button></div>`);if(!['player','staff','admin','commenter','viewer'].includes(profile.role))return draw('<div class="alert">権限設定を確認してください。</div>');await loadCases();if(['admin','staff','commenter'].includes(profile.role))await loadPendingCount();home();window.surLoadNotifications()}
function auth(){signupMode=false;draw(`<div class="card" style="max-width:520px;margin:30px auto"><h1>ログイン / 新規登録</h1><div class="line"><button id="signInTab" onclick="window.surTab('in')">ログイン</button><button id="signUpTab" class="secondary" onclick="window.surTab('up')">新規登録</button></div><div id="register" class="hide"><label>登録区分</label>${select('role',['選手','スタッフ'])}${field('氏名','full_name')}<label>学年</label>${select('grade',['1年','2年','3年','該当なし'])}</div>${field('メールアドレス','email','email')}${field('パスワード（英数字混在8文字以上）','password','password')}<button id="authAction" style="margin-top:14px" onclick="window.surAuth()">ログイン</button><p><button class="secondary" onclick="window.surForgotPassword()">パスワードを忘れた場合</button></p><p class="muted">実アカウントで接続します。氏名や傷害報告は許可された利用者にのみ表示されます。</p></div>`)}let signupMode=false;window.surTab=t=>{signupMode=t==='up';document.getElementById('register').classList.toggle('hide',!signupMode);document.getElementById('authAction').textContent=signupMode?'新規登録':'ログイン';document.getElementById('signInTab').classList.toggle('secondary',signupMode);document.getElementById('signUpTab').classList.toggle('secondary',!signupMode)};
window.surAuth=async()=>{const email=get('email'),password=get('password');if(!email||!password)return msg('メールとパスワードを入力してください');if(signupMode){if(password.length<8||!/[a-z]/i.test(password)||!/[0-9]/.test(password))return msg('英数字混在で8文字以上のパスワードが必要です');const name=get('full_name');if(!name)return msg('氏名を入力してください');const previous=await sb.auth.signInWithPassword({email,password});
if(!previous.error&&previous.data?.user){
 const existing=await sb.from('sur_profiles').select('role,is_archived').eq('id',previous.data.user.id).maybeSingle();
 if(existing.error)return err(existing.error);
 if(existing.data&&(existing.data.role==='rejected'||existing.data.is_archived)){
   const resend=await sb.rpc('sur_resubmit_account',{p_name:name,p_grade:get('grade'),p_requested_role:get('role')==='スタッフ'?'staff':'player'});
   if(resend.error)return err(resend.error);
   msg('再申請を受け付けました。スタッフの承認後に利用できます。');
   return refresh();
 }
 if(existing.data)return msg('このメールアドレスはすでに登録されています。通常のログインをご利用ください。');
 return profileForm();
}
const x=await sb.auth.signUp({email,password,options:{data:{sur_full_name:name,sur_grade:get('grade'),sur_requested_role:get('role')==='スタッフ'?'staff':'player'}}});
if(x.error)return err(x.error);
msg('申請を受け付けました。スタッフによる承認後にSURを利用できます。');refresh()}else{let x=await sb.auth.signInWithPassword({email,password});if(x.error)return err(x.error);refresh()}};
function profileForm(){draw(`<div class="card"><h1>プロフィールの登録</h1><p class="muted">氏名・区分を入力するとスタッフへの申請が完了します。承認後にSURを利用できます。</p><label>区分</label>${select('p_role',['選手','スタッフ'])}${field('氏名','p_name')}<label>学年</label>${select('p_grade',['1年','2年','3年','該当なし'])}<button style="margin-top:12px" onclick="window.surProfile()">登録</button><button class="secondary" onclick="window.surSignout()">ログアウト</button></div>`)}window.surProfile=async()=>{if(!get('p_name'))return msg('氏名を入力してください');let r=await sb.from('sur_profiles').insert({id:user.id,full_name:get('p_name'),grade:get('p_grade'),requested_role:get('p_role')==='スタッフ'?'staff':'player',role:'pending'});if(r.error)return err(r.error);refresh()};window.surSignout=async()=>{await sb.auth.signOut();refresh()};window.surReload=refresh;
async function loadCases(){let r=await sb.from('sur_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false});if(r.error){err(r.error);cases=[]}else cases=r.data||[]}

async function loadPendingCount(){const r=await sb.from('sur_profiles').select('id').eq('role','pending');pendingCount=r.error?0:(r.data||[]).length;if(profile?.role==='admin'){const u=await sb.rpc('sur_unfinished_signups');if(!u.error)pendingCount+=(u.data||[]).length}}

const surFormatRequestDate=value=>{if(!value)return '不明';const d=new Date(value);return Number.isNaN(d.getTime())?'不明':new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)};
let settingsTab='account';let permissionExpanded=false;
window.surSettings=(tab)=>{if(!['admin','staff','commenter'].includes(profile.role))return;weeklyExpanded=false;settingsExpanded=true;view='settings';settingsTab=profile.role==='admin'?(tab||settingsTab):'applications';window.surDrawSettings()};
window.surLoadMemberAvatars=async()=>{for(const img of document.querySelectorAll('[data-avatar-path]')){const path=img.getAttribute('data-avatar-path');if(!path)continue;const q=await sb.storage.from('sur-avatars').createSignedUrl(path,1800);if(q.data?.signedUrl)img.src=q.data.signedUrl;else img.style.display='none'}};
window.surDrawSettings=async()=>{
 const menu=[['account','アカウント'],['applications','申請'],['permissions','権限'],['exercises','リハビリメニュー']];
 const tabs='';
 let content='';
 if(settingsTab==='account'){
 content='<div class="card"><h2>個人情報の編集</h2><div class="sur-profile-avatar-line"><div id="sur-avatar-preview" class="sur-avatar-fallback" style="width:72px;height:72px">♙</div><div><label>顔写真（JPG / PNG / WebP、5MB以内）</label><input id="sur-avatar-file" type="file" accept="image/jpeg,image/png,image/webp"><button type="button" onclick="window.surSaveAvatar()">写真を設定</button></div></div><div class="sur-profile-fields"><div class="sur-profile-name"><label>氏名</label><input id="account_name" value="'+esc(profile.full_name)+'"></div><div class="sur-profile-grade"><label>学年</label><select id="account_grade">'+['1年','2年','3年','該当なし'].map(x=>'<option '+(profile.grade===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><button onclick="window.surSaveAccount()">個人情報を保存</button></div>'+
 '<div class="card"><h2>メールアドレス変更</h2><p class="muted">現在：'+esc(user.email||'')+'</p><label>新しいメールアドレス</label><input id="new_email" type="email"><button onclick="window.surChangeEmail()">変更を申請</button><p class="muted">確認メールの手続きが必要な場合があります。</p></div>'+
 '<div class="card"><h2>パスワード変更</h2><label>新しいパスワード</label><input id="new_password" type="password"><label>確認用（再入力）</label><input id="confirm_password" type="password"><div class="line"><button onclick="window.surChangePassword()">パスワードを変更</button><button class="secondary" onclick="window.surForgotPassword()">忘れた場合：メールで再設定</button></div></div>';
 }else if(settingsTab==='applications'){
   const r=await sb.from('sur_profiles').select('id,full_name,grade,requested_role,role,created_at').eq('role','pending').order('created_at',{ascending:false});
   if(r.error)return err(r.error);
   let unfinished=[];
   if(profile.role==='admin'){const u=await sb.rpc('sur_unfinished_signups');if(u.error)return err(u.error);unfinished=u.data||[]}
   pendingCount=(r.data||[]).length+unfinished.length;
   content='<div class="card"><h2>申請中 '+(pendingCount?'<span style="background:#c62828;color:white;border-radius:20px;padding:4px 10px">'+pendingCount+'件</span>':'')+'</h2><p class="muted">選手・スタッフの申請をまとめて表示しています。承認・拒否した申請は未対応一覧から消えます。</p>'+
   (r.data||[]).map(p=>'<div class="card"><b>'+esc(p.full_name) +'</b>（'+(p.requested_role==='staff'?'スタッフ':'選手')+'）<p class="muted">申請日時：'+esc(surFormatRequestDate(p.created_at))+'</p>'+(p.requested_role==='staff'&&profile.role==='admin'?'<label>承認後の権限</label><select id="role_'+p.id+'"><option value="commenter">コメント可</option><option value="viewer">閲覧のみ</option><option value="admin">管理者</option></select>':'')+'<div class="line"><button '+(p.requested_role==='staff'&&profile.role!=='admin'?'disabled':'')+' onclick="window.surReviewAccount(&quot;'+p.id+'&quot;,true)">承認</button><button class="danger" '+(p.requested_role==='staff'&&profile.role!=='admin'?'disabled':'')+' onclick="window.surReviewAccount(&quot;'+p.id+'&quot;,false)">拒否</button></div></div>').join('')+
   unfinished.map(u=>'<div class="card"><b>'+esc(u.email||'メール未登録')+'</b><p class="muted">登録情報未完了：氏名・選手／スタッフ区分の申請情報がありません。本人がメール確認後にログインし、プロフィールを登録すると承認できます。</p><p class="muted">登録日時：'+esc(surFormatRequestDate(u.created_at))+'</p></div>').join('')+
   (pendingCount?'':'<p>現在申請はありません。</p>')+'</div>';
 }else if(settingsTab==='players'||settingsTab==='staff-list'){
   const target=settingsTab==='players'?'player':'staff';
   const r=await sb.from('sur_profiles').select('id,full_name,grade,role,requested_role,weekly_report_recipient,is_hidden,is_archived,avatar_path').eq('requested_role',target).neq('role','pending').neq('role','rejected').order('full_name');
   if(r.error)return err(r.error);
   window.surMemberList=r.data||[];
   const activeMembers=window.surMemberList.filter(p=>!p.is_archived&&!p.is_hidden);

window.surSaveCase=async()=>{const injury=get('injury'),part=get('part'),visit=get('visit'),pain=Number(get('initial_pain'));if(injury==='その他'&&!get('injury_other')||part==='その他'&&!get('part_other'))return msg('その他の詳細を入力してください');if(['受診済み','受診予定'].includes(visit)&&!get('visit_details'))return msg('受診情報を入力してください');if(!Number.isInteger(pain)||pain<0||pain>10)return msg('NRSを0〜10で入力してください');if(get('situation')==='その他'&&!get('situation_other').trim())return msg('受傷場面の詳細を入力してください');const files=[...(document.getElementById('case_files')?.files||[])];if(files.length>5||files.some(f=>f.size>10*1024*1024))return msg('添付は5件以内、各10MB以内にしてください');const obj={player_id:user.id,player_name:profile.full_name,injury_category:injury,injury_other:injury==='その他'?get('injury_other'):null,body_part:part,body_part_other:part==='その他'?get('part_other'):null,side:get('side'),injured_on:get('injured'),target_return_on:get('target')||null,situation:get('situation')==='その他'?'その他：'+get('situation_other').trim():get('situation'),mechanism:get('mechanism'),visit_status:visit,visit_details:visit==='未受診'?null:get('visit_details'),medical_restrictions:get('restrictions'),initial_pain:pain,current_stage:0};let r=await sb.from('sur_cases').insert(obj).select('id').single();if(r.error)return err(r.error);let failed=[];for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90)||'file';const path=user.id+'/'+r.data.id+'/'+crypto.randomUUID()+'_'+safe;const up=await sb.storage.from('sur-rehab-media').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(up.error){failed.push(f.name);continue}const saved=await sb.from('sur_case_attachments').insert({case_id:r.data.id,uploader_id:user.id,storage_path:path,file_name:f.name,content_type:f.type||null});if(saved.error)failed.push(f.name)}await loadCases();window.surCase(r.data.id);if(failed.length)msg('報告は登録しましたが、一部ファイルの添付に失敗しました：'+failed.join('、'))};

function surInjurySites(c){const body=String(c.body_part||'');const keys=[['腕',/腕|肩|肘|手首|手関節|手指|前腕|上腕/],['胸部',/胸|肋骨|鎖骨/],['腰背部',/腰|背|脊椎|体幹/],['臀部',/臀|殿|股関節/],['大腿四頭筋',/大腿|太もも|膝/],['ハムストリングス',/大腿|太もも|膝/],['ふくらはぎ',/下腿|ふくらはぎ|アキレス/],['足関節',/足首|足関節|アキレス/],['足部（足趾）',/足部|足趾|足指|足底|踵|かかと/]];return keys.filter(x=>x[1].test(body)).map(x=>x[0])}
function surOuterMenu(c){const affected=surInjurySites(c);if(!affected.length)return '<div class="warn">傷害部位「'+esc(c.body_part||'未入力')+'」を9分類へ自動判定できないため、メニューを表示していません。スタッフが傷害部位を確認してください。</div>';const items=surOuterCatalog.map(x=>({...x,result:affected.map(k=>x.checks[surOuterSites.indexOf(k)]).includes('×')?'×':affected.map(k=>x.checks[surOuterSites.indexOf(k)]).includes('△')?'△':'○'})).filter(x=>x.result!=='×');return '<h2>患部外リハ｜候補 '+items.length+'件</h2><p class="muted">判定対象：'+esc(affected.join('・'))+'。○＝実施候補、△＝スタッフ確認後に検討、×＝除外。部位が複数該当する場合は厳しい方を採用します。</p>'+items.map(x=>'<details class="card"><summary><b>'+esc(x.category)+'｜'+esc(x.level)+'｜'+esc(x.name)+'</b>　'+(x.result==='△'?'⚠ 要確認':'○ 候補')+'</summary><p>姿勢：'+esc(x.posture)+'</p><p>'+esc(x.method)+'</p><p>回数：'+esc(x.reps)+' × '+esc(x.sets)+'セット　休息：'+esc(x.rest)+'</p><p>主な筋：'+esc(x.muscles)+'</p>'+(x.result==='△'?'<p class="warn">実施前にスタッフの確認が必要です。</p>':'')+'<p class="muted">強度を変更すると種目内容も変わります。運動の開始・増強はスタッフの評価に従ってください。</p></details>').join('')+'<p class="muted">傷害部位と運動制限の判定は補助情報です。スタッフによる個別評価を優先してください。</p>'}
function makeAdvice(c,a){const unsafe=['骨折','脱臼','脳振盪','体調不良'].includes(c.injury_category)||Boolean(c.medical_restrictions)||a?.reaction==='悪化した'||a?.swelling==='強い'||(a?.pain??0)>=5;if(unsafe)return '<div class="alert" style="margin-top:15px"><strong>通常メニューを保留</strong><p>傷害名・運動制限・症状から、安全性の再確認が必要です。トレーナー・医療機関に確認してください。</p></div>';const item=menu[c.current_stage];return (c.current_stage===0?surOuterMenu(c):`<h2>表示メニュー（評価用の候補）</h2><details><summary>${esc(item[0])}</summary><p>${esc(item[1])}</p><p class="muted">負荷や回数は傷害別の評価により変更します。痛みや腫れが増加した場合は中止して報告してください。</p></details><p class="muted">現段階では安全上、自己申告だけで次のStageへ移行できません。スタッフ画面の詳細編集からStageを更新できます。</p>`) }

function currentWed(){let d=new Date(),offset=(d.getDay()+4)%7;d.setDate(d.getDate()-offset);return d.toLocaleDateString('sv-SE')}let weeklySelectedCase=null,weeklyLocalComments={},weeklyLocalOverall='';

window.surWeekly=async()=>{settingsExpanded=false;permissionExpanded=false;weeklyExpanded=true;view='weekly';if(profile.role==='player')return;let base=currentWed(),end=new Date(base+'T12:00:00');end.setDate(end.getDate()-1);let start=new Date(base+'T12:00:00');start.setDate(start.getDate()-7);let w=await sb.from('sur_weekly_reports').select('*').eq('week_start',base).maybeSingle();if(w.error)return err(w.error);weeklyDraft=w.data;weeklyLocalComments={...(weeklyDraft?.comments||{})};weeklyLocalOverall=weeklyDraft?.overall||'';weeklySelectedCase=null;const sun=new Date(base+'T12:00:00');sun.setDate(sun.getDate()+4);const sunday=sun.toLocaleDateString('sv-SE');const items=cases.filter(c=>c.current_stage!==7||c.target_return_on>=base&&c.target_return_on<=sunday);window.weeklyItems=items;const readonly=weeklyDraft?.status==='submitted';draw(nav()+`<div class="card"><h1>週次リハビリレポート</h1><p>集計対象：${esc(start.toLocaleDateString('sv-SE'))}〜${esc(end.toLocaleDateString('sv-SE'))} / 水曜日発行</p><p class="pill">${readonly?'提出済み':'下書き'}</p><p class="muted">現在リハビリ中＋今週日曜までに復帰予定の選手（重複なし）</p><div class="tbl"><table><tr><th>選手</th><th>傷害</th><th>Stage</th><th>復帰予定</th><th>コメント</th></tr>${items.map(c=>`<tr><td>${esc(c.player_name)}</td><td>${esc(c.injury_category)}</td><td>${esc(stages[c.current_stage])}</td><td>${esc(c.target_return_on||'未定')}</td><td><button class="secondary" onclick="window.surChooseWeeklyComment('${c.id}')">コメント</button></td></tr>`).join('')}</table></div><h2 id="weekly_comment_title">トレーナーコメント｜総評</h2><textarea id="weekly_comment_editor" ${readonly?'disabled':''}>${esc(weeklyLocalOverall)}</textarea><div class="line no-print" style="margin-top:10px"><button id="weekly_individual_save" style="display:none" ${readonly?'disabled':''} onclick="window.surSaveIndividualWeeklyComment()">保存</button><button ${readonly?'disabled':''} onclick="window.surSaveWeekly(false)">下書き保存</button><button ${readonly?'disabled':''} onclick="window.surSaveWeekly(true)">提出確定</button><button class="secondary" onclick="window.print()">PDF用印刷</button><button class="secondary" onclick="window.surWeeklyCsv()">Excel用CSV</button></div></div>`)};
window.surSaveIndividualWeeklyComment=async()=>{
 if(!weeklySelectedCase||weeklyDraft?.status==='submitted')return;
 const area=document.getElementById('weekly_comment_editor');
 weeklyLocalComments[weeklySelectedCase]=area?.value||'';
 const success=await window.surSaveWeekly(false,true);

};
window.surSaveWeekly=async (submit,stay=false)=>{
 if(submit&&!confirm('提出済みに確定しますか？'))return false;
 const area=document.getElementById('weekly_comment_editor');
 if(weeklySelectedCase)weeklyLocalComments[weeklySelectedCase]=area?.value||'';
 else weeklyLocalOverall=area?.value||'';
 const base=currentWed(),start=new Date(base+'T12:00:00');start.setDate(start.getDate()-7);
 let row={week_start:base,week_end:new Date(start.getTime()+6*86400000).toLocaleDateString('sv-SE'),report_rows:window.weeklyItems.map(c=>({id:c.id,name:c.player_name,injury:c.injury_category,stage:c.current_stage,target:c.target_return_on})),comments:weeklyLocalComments,overall:weeklyLocalOverall,status:submit?'submitted':'draft',submitted_by:submit?user.id:null,submitted_at:submit?new Date().toISOString():null};
 let r=await sb.from('sur_weekly_reports').upsert(row,{onConflict:'week_start'});
 if(r.error){err(r.error);return false}
 if(!stay){msg(submit?'提出状態を保存しました。外部への送信は未設定です。':'下書きを保存しました');await window.surWeekly()}
 else{weeklyDraft={...row};msg('選手別コメントを保存しました')}
 return true
};

window.surArchiveSearch=q=>{weeklyArchiveQuery=q;window.surRenderWeeklyArchive();const el=document.getElementById('weekly_archive_query');el?.focus();el?.setSelectionRange(q.length,q.length)};
window.surWeeklyDetail=async id=>{if(profile.role==='player')return;let w=(window.surWeeklyArchive||[]).find(x=>x.id===id);if(!w){const r=await sb.from('sur_weekly_reports').select('*').eq('id',id).maybeSingle();if(r.error)return err(r.error);w=r.data}if(!w)return msg('報告が見つかりません');weeklyExpanded=true;view='weekly-detail';draw(nav()+'<div class="card"><h1>週次レポート詳細</h1><p>'+esc(w.week_start)+'〜'+esc(w.week_end)+' / '+(w.status==='submitted'?'提出済み':'下書き')+'</p><div class="tbl"><table><tr><th>選手名</th><th>傷害</th><th>Stage</th><th>復帰予定</th><th>選手別コメント</th></tr>'+(w.report_rows||[]).map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.injury)+'</td><td>'+esc(stages[c.stage]||c.stage)+'</td><td>'+esc(c.target||'未定')+'</td><td>'+esc((w.comments||{})[c.id]||'')+'</td></tr>').join('')+'</table></div><h2>総評コメント</h2><p style="white-space:pre-wrap">'+esc(w.overall||'')+'</p><button class="secondary" onclick="window.surWeeklyHistory()">一覧へ戻る</button></div>')};
window.surWeeklyCsv=()=>{const rows=[['選手','傷害','Stage','復帰予定'],...window.weeklyItems.map(c=>[c.player_name,c.injury_category,stages[c.current_stage],c.target_return_on||''])];const csv='\uFEFF'+rows.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SUR-weekly-'+currentWed()+'.csv';a.click();URL.revokeObjectURL(a.href)};
let surPasswordRecovery=false;
window.surRecoveryForm=()=>{surPasswordRecovery=true;draw('<div class="card" style="max-width:520px;margin:30px auto"><h1>パスワード再設定</h1><label>新しいパスワード（英数字混在8文字以上）</label><input id="recover_password" type="password" autocomplete="new-password"><label>確認用パスワード（再入力）</label><input id="recover_password_confirm" type="password" autocomplete="new-password"><button style="margin-top:12px" onclick="window.surSubmitRecovery()">パスワードを再設定</button></div>')};
window.surSubmitRecovery=async()=>{const a=get('recover_password'),b=get('recover_password_confirm');if(a!==b)return msg('確認用のパスワードが一致しません');if(a.length<8||!/[a-z]/i.test(a)||!/[0-9]/.test(a))return msg('英数字混在8文字以上で設定してください');const r=await sb.auth.updateUser({password:a});if(r.error)return err(r.error);surPasswordRecovery=false;history.replaceState(null,'',location.pathname);msg('再設定が完了しました');await refresh()};
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')window.surRecoveryForm()});
refresh().then(()=>{if(surPasswordRecovery)window.surRecoveryForm()}).catch(e => {
 document.getElementById('app').innerHTML='<div class="card"><h1>SURの接続に失敗しました</h1><p>'+String(e?.message||e).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再試行</button></div>';
});
</script></body></html>
