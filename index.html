window.surWatchdog = setTimeout(() => {
 const node=document.getElementById('app');
 if(node && node.textContent.includes('接続しています')) node.innerHTML = '<div class="card"><h1>SURを起動できませんでした</h1><p>認証用プログラムが読み込めないか、接続が完了していません。</p><p>ページを再読み込みしてください。解決しない場合はネットワークやブラウザを変更してください。</p><button onclick="location.reload()">再読み込み</button></div>';
}, 12000);
window.addEventListener('unhandledrejection', e => {
 const node=document.getElementById('app');
 if(node && node.textContent.includes('接続しています')) node.innerHTML='<div class="card"><h1>SURの起動エラー</h1><p>'+String(e.reason?.message||e.reason||'通信に失敗しました').replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再読み込み</button></div>';
});
</script><script type="module">
const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm').catch(e => { document.getElementById('app').innerHTML='<div class="card"><h1>認証ライブラリの読み込み失敗</h1><p>CDNへの接続を確認してください。</p><p>'+String(e?.message||e).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再試行</button></div>'; throw e; });
const sb=createClient('https://bytgtfpmxouylyluvaxr.supabase.co','sb_publishable_2vN1_NxbHsa5LTGEUAg5aQ_-akjnqJB',{auth:{persistSession:true,autoRefreshToken:true}});
const el=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const today=()=>new Date().toLocaleDateString('sv-SE');const stages=['受傷直後・急性期','ジムリハビリⅠ','ジムリハビリⅡ','フィールドⅠ','フィールドⅡ','フィールドⅢ','復帰走前チェック','復帰済み'];let user=null,profile=null,cases=[],view='home',active=null,weeklyDraft=null,pendingCount=0;
function draw(html){el.innerHTML=html}function msg(v){alert(v)}function err(e){msg(e?.message||String(e))}const select=(id,vals)=>`<select id="${id}">${vals.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;const field=(name,id,type='text',value='')=>`<label>${name}</label><input id="${id}" type="${type}" value="${esc(value)}">`;
const get=id=>document.getElementById(id)?.value?.trim()||'';
async function refresh(){let {data:{user:u},error:e}=await sb.auth.getUser();if(e||!u){user=null;profile=null;return auth()}user=u;let r=await sb.from('sur_profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)return draw(`<div class="alert">プロフィール読込エラー: ${esc(r.error.message)}</div>`);profile=r.data;if(!profile)return profileForm();if(profile.role==='rejected')return draw('<div class="card"><h1>申請は承認されませんでした</h1><button onclick="window.surSignout()">ログアウト</button></div>');if(profile.role==='pending')return draw(`<div class="card"><h1>アカウント確認待ち</h1><p>登録は完了しました。管理者による選手・スタッフ権限の確認後に利用できます。</p><button onclick="window.surSignout()">ログアウト</button><button class="secondary" onclick="window.surReload()">再確認</button></div>`);if(!['player','staff','admin'].includes(profile.role))return draw('<div class="alert">権限設定を確認してください。</div>');await loadCases();if(profile.role==='admin')await loadPendingCount();home()}
function auth(){draw(`<div class="card" style="max-width:520px;margin:30px auto"><h1>ログイン / 新規登録</h1><div class="line"><button id="signInTab" onclick="window.surTab('in')">ログイン</button><button class="secondary" onclick="window.surTab('up')">新規登録</button></div><div id="register" class="hide"><label>登録区分</label>${select('role',['選手','スタッフ'])}${field('氏名','full_name')}<label>学年</label>${select('grade',['1年','2年','3年','該当なし'])}</div>${field('メールアドレス','email','email')}${field('パスワード（英数字混在8文字以上）','password','password')}<button id="authAction" style="margin-top:14px" onclick="window.surAuth()">ログイン</button><p class="muted">実アカウントで接続します。氏名や傷害報告は許可された利用者にのみ表示されます。</p></div>`)}let signupMode=false;window.surTab=t=>{signupMode=t==='up';document.getElementById('register').classList.toggle('hide',!signupMode);document.getElementById('authAction').textContent=signupMode?'新規登録':'ログイン'};
window.surAuth=async()=>{const email=get('email'),password=get('password');if(!email||!password)return msg('メールとパスワードを入力してください');if(signupMode){if(password.length<8||!/[a-z]/i.test(password)||!/[0-9]/.test(password))return msg('英数字混在で8文字以上のパスワードが必要です');const name=get('full_name');if(!name)return msg('氏名を入力してください');let x=await sb.auth.signUp({email,password});if(x.error)return err(x.error);if(x.data.user&&x.data.session){let p=await sb.from('sur_profiles').insert({id:x.data.user.id,full_name:name,grade:get('grade'),requested_role:get('role')==='スタッフ'?'staff':'player',role:'pending'});if(p.error)return err(p.error)}msg('登録を受け付けました。メール確認が必要な場合は確認を完了し、ログイン後にプロフィールを登録してください。');refresh()}else{let x=await sb.auth.signInWithPassword({email,password});if(x.error)return err(x.error);refresh()}};
function profileForm(){draw(`<div class="card"><h1>プロフィールの登録</h1><p class="muted">メール確認後にもう一度登録内容を保存してください。</p><label>区分</label>${select('p_role',['選手','スタッフ'])}${field('氏名','p_name')}<label>学年</label>${select('p_grade',['1年','2年','3年','該当なし'])}<button style="margin-top:12px" onclick="window.surProfile()">登録</button><button class="secondary" onclick="window.surSignout()">ログアウト</button></div>`)}window.surProfile=async()=>{let r=await sb.from('sur_profiles').insert({id:user.id,full_name:get('p_name'),grade:get('p_grade'),requested_role:get('p_role')==='スタッフ'?'staff':'player',role:'pending'});if(r.error)return err(r.error);refresh()};window.surSignout=async()=>{await sb.auth.signOut();refresh()};window.surReload=refresh;
async function loadCases(){let r=await sb.from('sur_cases').select('*').is('deleted_at',null).order('created_at',{ascending:false});if(r.error){err(r.error);cases=[]}else cases=r.data||[]}

async function loadPendingCount(){const r=await sb.from('sur_profiles').select('id').eq('role','pending');pendingCount=r.error?0:(r.data||[]).length}
window.surSettings=async()=>{
 if(profile.role!=='admin')return;
 await loadPendingCount();
 const r=await sb.from('sur_profiles').select('id,full_name,grade,requested_role,role,created_at').eq('role','pending').order('created_at',{ascending:false});
 if(r.error)return err(r.error);
 const rows=(r.data||[]).map(p=>{
   const id=p.id;
   const choices=p.requested_role==='staff'?'<label>スタッフ権限</label><select id="role_'+id+'"><option value="admin">管理者</option><option value="commenter">コメント可</option><option value="viewer">閲覧のみ</option></select>':'';
   return '<div class="card"><b>'+esc(p.full_name)+'</b> ('+esc(p.requested_role==='staff'?'スタッフ':'選手')+')<p>'+esc(p.grade||'')+'</p>'+choices+'<div class="line"><button onclick="window.surReviewAccount(&quot;'+id+'&quot;,true)">承認</button><button class="danger" onclick="window.surReviewAccount(&quot;'+id+'&quot;,false)">拒否</button></div></div>';
 }).join('');
 draw(nav()+'<div class="card"><h1>設定 / アカウント管理</h1><h2>申請中 <span style="background:#c62828;color:white;border-radius:20px;padding:4px 10px">'+(r.data||[]).length+'件</span></h2>'+ (rows||'<p>申請はありません。</p>')+'</div>');
};
window.surReviewAccount=async(id,approve)=>{
 if(profile.role!=='admin')return;
 const role=approve?(document.getElementById('role_'+id)?.value||'player'):'rejected';
 if(!confirm(approve?'申請を承認しますか？':'申請を拒否しますか？'))return;
 const r=await sb.rpc('sur_manage_account',{target_id:id,next_role:role});
 if(r.error)return err(r.error);
 await window.surSettings();
};
function nav(){return `<nav class="no-print"><button onclick="window.surHome()">HOME</button><button class="secondary" onclick="window.surNew()">新規傷害報告</button>${profile.role!=='player'?'<button class="secondary" onclick="window.surWeekly()">週次レポート</button>':''}${profile.role==='admin'?'<button class="secondary" onclick="window.surSettings()">設定 '+(pendingCount?'<b style="background:#c62828;border-radius:20px;padding:3px 8px;color:white">'+pendingCount+'</b>':'')+'</button>':''}<button class="secondary" onclick="window.surSignout()">ログアウト</button></nav>`}function home(){view='home';const isStaff=profile.role!=='player';draw(nav()+`<div class="card"><h1>${isStaff?'傷害報告一覧':'リハビリテーション'}</h1><p class="muted">${isStaff?'選手を選択すると報告詳細と編集操作を表示します。':'傷害報告を登録してからリハビリメニューへ進んでください。'}</p><div class="line no-print"><button onclick="window.surNew()">傷害報告の新規登録</button><button class="secondary" onclick="window.surHome()">傷害報告済み・確認</button></div></div><div class="card"><h2>リハビリ中</h2>${caseList(cases.filter(c=>c.current_stage!==7))}</div><div class="card"><h2>復帰済み</h2>${caseList(cases.filter(c=>c.current_stage===7))}</div>`)}function caseList(items){if(!items.length)return '<p class="muted">報告はありません。</p>';return `<div class="tbl"><table><thead><tr><th>選手</th><th>傷害名</th><th>受傷日</th><th>復帰予定日</th><th>Stage</th></tr></thead><tbody>${items.map(c=>`<tr class="pick" onclick="window.surCase('${c.id}')"><td>${esc(c.player_name)}</td><td>${esc(c.injury_category==='その他'?c.injury_other:c.injury_category)}</td><td>${esc(c.injured_on)}</td><td>${esc(c.target_return_on||'未定')}</td><td>${esc(stages[c.current_stage])}</td></tr>`).join('')}</tbody></table></div>`}window.surHome=()=>home();window.surNew=()=>newCase();
const injuries=['捻挫','打撲','骨折','脱臼','炎症','傷','筋の張り','脳振盪','体調不良','その他'],parts=['足関節','膝','大腿部','下腿','股関節','腰','肩','手','頭部','その他'];window.surConditional=(id,box,values)=>document.getElementById(box).classList.toggle('hide',!values.includes(get(id)));
function newCase(){draw(nav()+`<div class="card"><h1>傷害報告の新規登録</h1><div class="formgrid"><div><label>傷害名</label><select id="injury" onchange="window.surConditional('injury','injuryOther',['その他'])">${injuries.map(v=>`<option>${v}</option>`).join('')}</select><div id="injuryOther" class="hide">${field('その他の傷害名','injury_other')}</div></div><div><label>部位</label><select id="part" onchange="window.surConditional('part','partOther',['その他'])">${parts.map(v=>`<option>${v}</option>`).join('')}</select><div id="partOther" class="hide">${field('その他の部位','part_other')}</div></div><div><label>左右</label>${select('side',['右','左','両側','該当なし'])}</div><div>${field('受傷日','injured','date',today())}</div><div>${field('復帰予定日（未定は空欄）','target','date')}</div><div><label>受傷場面</label>${select('situation',['練習','公式戦','練習試合','その他'])}</div><div><label>受診状況</label><select id="visit" onchange="window.surConditional('visit','visitMore',['受診済み','受診予定'])"><option>未受診</option><option>受診済み</option><option>受診予定</option></select><div id="visitMore" class="hide"><label>受診先・受診日・診断名など</label><textarea id="visit_details"></textarea></div></div><div>${field('受傷直後の痛み NRS 0〜10','initial_pain','number','3')}</div></div><label>受傷機転</label><textarea id="mechanism"></textarea><label>医師の運動制限・注意事項</label><textarea id="restrictions"></textarea><div class="line"><button onclick="window.surSaveCase()">報告を登録</button><button class="secondary" onclick="window.surHome()">戻る</button></div></div>`)}
window.surSaveCase=async()=>{const injury=get('injury'),part=get('part'),visit=get('visit'),pain=Number(get('initial_pain'));if(injury==='その他'&&!get('injury_other')||part==='その他'&&!get('part_other'))return msg('その他の詳細を入力してください');if(['受診済み','受診予定'].includes(visit)&&!get('visit_details'))return msg('受診情報を入力してください');if(!Number.isInteger(pain)||pain<0||pain>10)return msg('NRSを0〜10で入力してください');const obj={player_id:user.id,player_name:profile.full_name,injury_category:injury,injury_other:injury==='その他'?get('injury_other'):null,body_part:part,body_part_other:part==='その他'?get('part_other'):null,side:get('side'),injured_on:get('injured'),target_return_on:get('target')||null,situation:get('situation'),mechanism:get('mechanism'),visit_status:visit,visit_details:visit==='未受診'?null:get('visit_details'),medical_restrictions:get('restrictions'),initial_pain:pain,current_stage:0};let r=await sb.from('sur_cases').insert(obj).select('id').single();if(r.error)return err(r.error);await loadCases();window.surCase(r.data.id)};
window.surCase=id=>{active=cases.find(c=>c.id===id);if(!active)return;let c=active,staff=profile.role!=='player';draw(nav()+`<div class="card"><div class="line"><h1>傷害報告の詳細</h1><span class="pill">${esc(stages[c.current_stage])}</span></div><div class="grid">${[['選手名',c.player_name],['傷害名',c.injury_category==='その他'?c.injury_other:c.injury_category],['部位',c.body_part==='その他'?c.body_part_other:c.body_part],['左右',c.side],['受傷日',c.injured_on],['復帰予定日',c.target_return_on||'未定'],['受診状況',c.visit_status],['受診情報',c.visit_details||'なし'],['受傷直後の痛み NRS 0〜10',c.initial_pain],['医師の運動制限',c.medical_restrictions||'なし']].map(([k,v])=>`<div><div class="muted">${k}</div><b>${esc(v)}</b></div>`).join('')}</div><div class="line no-print" style="margin-top:20px"><button onclick="window.surStage()">現在のリハビリへ</button>${staff?'<button class="secondary" onclick="window.surEdit()">編集</button>':''}<button class="secondary" onclick="window.surHome()">一覧に戻る</button></div></div>`)};
window.surEdit=()=>{if(!['admin','staff'].includes(profile.role)||!active)return;let c=active;draw(nav()+`<div class="card"><h1>傷害報告の編集</h1><p>${esc(c.player_name)}</p><label>傷害名</label>${select('edit_injury',injuries)}${field('復帰予定日','edit_target','date',c.target_return_on||'')}<label>Stage</label><select id="edit_stage">${stages.map((s,i)=>`<option value="${i}" ${i===c.current_stage?'selected':''}>${esc(s)}</option>`).join('')}</select><label>医師の運動制限</label><textarea id="edit_restrictions">${esc(c.medical_restrictions)}</textarea><div class="line"><button onclick="window.surSaveEdit()">保存</button><button class="secondary" onclick="window.surCase('${c.id}')">キャンセル</button></div></div>`);document.getElementById('edit_injury').value=c.injury_category};window.surSaveEdit=async()=>{if(!['admin','staff'].includes(profile.role))return;let c=active,stage=Number(get('edit_stage'));if(get('edit_injury')==='その他'&&c.injury_category!=='その他')return msg('その他の傷害名は元の詳細を編集する必要があります');let patch={injury_category:get('edit_injury'),target_return_on:get('edit_target')||null,medical_restrictions:get('edit_restrictions'),current_stage:stage,returned_on:stage===7?today():null};let r=await sb.from('sur_cases').update(patch).eq('id',c.id);if(r.error)return err(r.error);await loadCases();window.surCase(c.id)};
const menu=[['患部を保護したセルフケア','保護・圧迫、症状変化の確認。強い症状や危険兆候がある場合は受診を優先'],['患部外・患部の基本運動','患部外のコンディショニングと許可範囲内の可動域・筋活動'],['ランニングの準備','筋力・バランス・機能評価を進め、ランニング基準を確認'],['フィールドⅠ','低強度Jog、短いパス、直線的なアジリティ'],['フィールドⅡ','HSR、方向転換、中距離パス'],['フィールドⅢ','Sprint、複合アジリティ、段階的なボール動作'],['復帰走前チェック','反復スプリント・ジャンプ・カッティング・ボール動作等の確認']];
window.surStage=async()=>{let c=active;if(!c)return;if(c.current_stage===7)return draw(nav()+'<div class="card"><h1>復帰済み</h1><p>スタッフが復帰日を記録しています。</p></div>');let r=await sb.from('sur_assessments').select('*').eq('case_id',c.id).order('created_at',{ascending:false}).limit(1);let a=r.data?.[0];draw(nav()+`<div class="card"><h1>${esc(stages[c.current_stage])}</h1><p class="muted">${esc(c.player_name)}｜${esc(c.injury_category)}｜選択した傷害情報と症状に応じた案内</p><div class="warn">本機能は運動処方ではありません。骨折・脱臼・脳振盪・未評価の強い症状などは、専門家の指示を優先してください。</div>${c.current_stage<=6?`<h2>現在の状態を確認</h2><label>現在の痛み NRS 0〜10</label><input id="nrs" type="number" min="0" max="10" value="${a?.pain??''}"><label>腫れ</label>${select('swell',['なし','軽度','強い'])}<label>前回の運動後の状態</label>${select('reaction',['悪化なし','悪化した','まだ運動していない'])}<button style="margin-top:12px" onclick="window.surAssessment()">回答を保存してメニューを更新</button>`:''}<div id="recommendations">${makeAdvice(c,a)}</div><div class="line no-print"><button class="secondary" onclick="window.surHome()">一覧に戻る</button></div></div>`);if(a){document.getElementById('swell').value=a.swelling||'なし';document.getElementById('reaction').value=a.reaction||'悪化なし'}};
function makeAdvice(c,a){const unsafe=['骨折','脱臼','脳振盪','体調不良'].includes(c.injury_category)||Boolean(c.medical_restrictions)||a?.reaction==='悪化した'||a?.swelling==='強い'||(a?.pain??0)>=5;if(unsafe)return '<div class="alert" style="margin-top:15px"><strong>通常メニューを保留</strong><p>傷害名・運動制限・症状から、安全性の再確認が必要です。トレーナー・医療機関に確認してください。</p></div>';const item=menu[c.current_stage];return `<h2>表示メニュー（評価用の候補）</h2><details><summary>${esc(item[0])}</summary><p>${esc(item[1])}</p><p class="muted">負荷や回数は傷害別の評価により変更します。痛みや腫れが増加した場合は中止して報告してください。</p></details><p class="muted">現段階では安全上、自己申告だけで次のStageへ移行できません。スタッフ画面の詳細編集からStageを更新できます。</p>`}
window.surAssessment=async()=>{let n=Number(get('nrs'));if(!Number.isInteger(n)||n<0||n>10)return msg('NRSは0〜10で入力してください');let r=await sb.from('sur_assessments').insert({case_id:active.id,player_id:user.id,stage:active.current_stage,pain:n,swelling:get('swell'),reaction:get('reaction')});if(r.error)return err(r.error);window.surStage()};
function currentWed(){let d=new Date(),offset=(d.getDay()+4)%7;d.setDate(d.getDate()-offset);return d.toLocaleDateString('sv-SE')}window.surWeekly=async()=>{if(profile.role==='player')return;let base=currentWed(),end=new Date(base+'T12:00:00');end.setDate(end.getDate()-1);let start=new Date(base+'T12:00:00');start.setDate(start.getDate()-7);let w=await sb.from('sur_weekly_reports').select('*').eq('week_start',base).maybeSingle();if(w.error)return err(w.error);weeklyDraft=w.data;const sun=new Date(base+'T12:00:00');sun.setDate(sun.getDate()+4);const sunday=sun.toLocaleDateString('sv-SE');const items=cases.filter(c=>c.current_stage!==7||c.target_return_on>=base&&c.target_return_on<=sunday);draw(nav()+`<div class="card"><h1>週次リハビリレポート</h1><p>集計対象：${esc(start.toLocaleDateString('sv-SE'))}〜${esc(end.toLocaleDateString('sv-SE'))} / 水曜日発行</p><p class="pill">${weeklyDraft?.status==='submitted'?'提出済み':'下書き'}</p><p class="muted">現在リハビリ中＋今週日曜までに復帰予定の選手（重複なし）</p><div class="tbl"><table><tr><th>選手</th><th>傷害</th><th>Stage</th><th>復帰予定</th></tr>${items.map(c=>`<tr><td>${esc(c.player_name)}</td><td>${esc(c.injury_category)}</td><td>${esc(stages[c.current_stage])}</td><td>${esc(c.target_return_on||'未定')}</td></tr>`).join('')}</table></div><h2>トレーナーコメント</h2>${items.map(c=>`<label>${esc(c.player_name)}｜${esc(c.injury_category)}</label><textarea id="note_${c.id}" ${weeklyDraft?.status==='submitted'?'disabled':''}>${esc(weeklyDraft?.comments?.[c.id]||'')}</textarea>`).join('')}<label>総評</label><textarea id="overall" ${weeklyDraft?.status==='submitted'?'disabled':''}>${esc(weeklyDraft?.overall)}</textarea><div class="line no-print"><button ${weeklyDraft?.status==='submitted'?'disabled':''} onclick="window.surSaveWeekly(false)">下書き保存</button><button ${weeklyDraft?.status==='submitted'?'disabled':''} onclick="window.surSaveWeekly(true)">提出確定</button><button class="secondary" onclick="window.print()">PDF用印刷</button><button class="secondary" onclick="window.surWeeklyCsv()">Excel用CSV</button></div></div>`);window.weeklyItems=items};window.surSaveWeekly=async submit=>{if(submit&&!confirm('提出済みに確定しますか？'))return;const base=currentWed(),start=new Date(base+'T12:00:00');start.setDate(start.getDate()-7);let comments={};for(const c of window.weeklyItems)comments[c.id]=get('note_'+c.id);let row={week_start:base,week_end:new Date(start.getTime()+6*86400000).toLocaleDateString('sv-SE'),report_rows:window.weeklyItems.map(c=>({id:c.id,name:c.player_name,injury:c.injury_category,stage:c.current_stage,target:c.target_return_on})),comments,overall:get('overall'),status:submit?'submitted':'draft',submitted_by:submit?user.id:null,submitted_at:submit?new Date().toISOString():null};let r=await sb.from('sur_weekly_reports').upsert(row,{onConflict:'week_start'});if(r.error)return err(r.error);msg(submit?'提出状態を保存しました。外部への送信は未設定です。':'下書きを保存しました');window.surWeekly()};window.surWeeklyCsv=()=>{const rows=[['選手','傷害','Stage','復帰予定'],...window.weeklyItems.map(c=>[c.player_name,c.injury_category,stages[c.current_stage],c.target_return_on||''])];const csv='\uFEFF'+rows.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SUR-weekly-'+currentWed()+'.csv';a.click();URL.revokeObjectURL(a.href)};
refresh().catch(e => {
 document.getElementById('app').innerHTML='<div class="card"><h1>SURの接続に失敗しました</h1><p>'+String(e?.message||e).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">再試行</button></div>';
});
</script></body></html>
